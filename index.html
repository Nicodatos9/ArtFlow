<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtFlow — ONIS Artwork Validation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --kraft: #c8a96e;
      --kraft-dark: #a07840;
      --kraft-light: #f5ead6;
      --kraft-bg: #fdf6ea;
      --ink: #2c1f0e;
      --ink-soft: #5a4030;
      --white: #ffffff;
      --green: #2d6a4f;
      --red: #c0392b;
      --border: #d4b483;
      --shadow: rgba(44,31,14,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--kraft-bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--ink);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid var(--kraft);
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--kraft);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--kraft-light);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
      opacity: 0.7;
    }
    .logo-divider {
      width: 1px;
      height: 36px;
      background: var(--kraft-dark);
      margin: 0 8px;
    }
    .header-title {
      font-size: 13px;
      color: var(--kraft-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* MAIN */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* MODE SELECTOR */
    .mode-section {
      margin-bottom: 32px;
    }
    .mode-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }
    .mode-tabs {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      width: fit-content;
    }
    .mode-tab {
      padding: 10px 28px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      background: var(--white);
      color: var(--ink-soft);
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .mode-tab.active {
      background: var(--ink);
      color: var(--kraft);
    }
    .mode-tab:not(.active):hover {
      background: var(--kraft-light);
    }

    /* UPLOAD ZONE */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    .upload-grid.single {
      grid-template-columns: 1fr;
    }

    .upload-card {
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 28px 20px;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
      position: relative;
    }
    .upload-card:hover, .upload-card.dragover {
      border-color: var(--kraft-dark);
      background: var(--kraft-light);
    }
    .upload-card.has-file {
      border-style: solid;
      border-color: var(--kraft-dark);
      background: var(--kraft-light);
    }
    .upload-card input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .upload-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .upload-hint {
      font-size: 11px;
      color: var(--ink-soft);
      opacity: 0.6;
    }
    .upload-filename {
      font-size: 12px;
      color: var(--green);
      font-weight: 600;
      margin-top: 8px;
      word-break: break-all;
    }

    /* VALIDATE BUTTON */
    .btn-validate {
      width: 100%;
      padding: 16px;
      background: var(--ink);
      color: var(--kraft);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 36px;
    }
    .btn-validate:hover:not(:disabled) {
      background: var(--kraft-dark);
      color: var(--white);
    }
    .btn-validate:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* PROGRESS */
    #progress {
      display: none;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: 1px;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--kraft-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTS */
    #results { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .result-pp {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .result-verdict {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 24px;
      border-radius: 4px;
    }
    .result-verdict.approved {
      background: var(--green);
      color: var(--white);
    }
    .result-verdict.rejected {
      background: var(--red);
      color: var(--white);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: var(--white);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 24px;
    }
    .result-table th {
      background: var(--ink);
      color: var(--kraft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
    }
    .result-table td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--kraft-light);
      vertical-align: middle;
    }
    .result-table tr:last-child td { border-bottom: none; }
    .result-table tr:hover td { background: var(--kraft-bg); }
    .result-table td:first-child { font-weight: 600; color: var(--ink-soft); }
    .result-table td.status { text-align: center; font-size: 16px; }
    td.fail { background: #fff5f5; }
    td.fail-val { color: var(--red); font-weight: 600; }

    .error-box {
      background: #fff5f5;
      border: 1.5px solid var(--red);
      border-radius: 6px;
      padding: 16px 20px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 20px;
    }

    .btn-reset {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--ink-soft);
      padding: 10px 24px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 5px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-reset:hover {
      border-color: var(--kraft-dark);
      color: var(--ink);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.5;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .upload-grid { grid-template-columns: 1fr; }
      header { padding: 16px 20px; }
      main { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo-text">ONIS</div>
    <div class="logo-sub">Glassware</div>
  </div>
  <div class="logo-divider"></div>
  <div class="header-title">ArtFlow — Artwork Validation</div>
</header>

<main>

  <!-- MODE -->
  <div class="mode-section">
    <div class="mode-label">Modo de validação</div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-priority" onclick="setMode('priority')">Priority List</button>
      <button class="mode-tab" id="tab-briefing" onclick="setMode('briefing')">Briefing NPD</button>
    </div>
  </div>

  <!-- UPLOAD -->
  <div class="upload-grid" id="upload-grid">

    <div class="upload-card" id="card-pdf">
      <input type="file" id="input-pdf" accept=".pdf" onchange="onFileSelect('pdf', this)">
      <div class="upload-icon">📄</div>
      <div class="upload-title">Artwork PDF</div>
      <div class="upload-hint">Arrasta ou clica para carregar</div>
      <div class="upload-filename" id="name-pdf"></div>
    </div>

    <div class="upload-card" id="card-excel" style="display:none">
      <input type="file" id="input-excel" accept=".xlsx,.xls" onchange="onFileSelect('excel', this)">
      <div class="upload-icon">📊</div>
      <div class="upload-title">Briefing Excel</div>
      <div class="upload-hint">Template Briefing 2026</div>
      <div class="upload-filename" id="name-excel"></div>
    </div>

  </div>

  <button class="btn-validate" id="btn-validate" disabled onclick="runValidation()">
    Validar Artwork
  </button>

  <div id="progress">
    <span class="spinner"></span> A extrair e validar...
  </div>

  <div id="results"></div>

</main>

<footer>ONIS Glassware · Crisal SA · ArtFlow v1.0</footer>

<script>
  // ─── PDF.js worker ───────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ─── State ────────────────────────────────────────────────────────────────
  let mode = 'priority';
  let pdfFile = null;
  let excelFile = null;

  // ─── Mode switch ─────────────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('tab-priority').classList.toggle('active', m === 'priority');
    document.getElementById('tab-briefing').classList.toggle('active', m === 'briefing');
    document.getElementById('card-excel').style.display = m === 'briefing' ? '' : 'none';
    document.getElementById('upload-grid').classList.toggle('single', m === 'priority');
    checkReady();
  }

  // ─── File select ─────────────────────────────────────────────────────────
  function onFileSelect(type, input) {
    if (!input.files.length) return;
    const file = input.files[0];
    if (type === 'pdf') {
      pdfFile = file;
      document.getElementById('name-pdf').textContent = file.name;
      document.getElementById('card-pdf').classList.add('has-file');
    } else {
      excelFile = file;
      document.getElementById('name-excel').textContent = file.name;
      document.getElementById('card-excel').classList.add('has-file');
    }
    checkReady();
  }

  function checkReady() {
    const ready = pdfFile && (mode === 'priority' || excelFile);
    document.getElementById('btn-validate').disabled = !ready;
  }

  // ─── PDF text extraction ──────────────────────────────────────────────────
  async function extractPdfText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(s => s.str).join(' ') + '\n';
    }
    return text;
  }

  // ─── Excel parsing ────────────────────────────────────────────────────────
  function parseExcel(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          resolve(wb);
        } catch(err) { reject(err); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  // ─── Detect PP from filename ──────────────────────────────────────────────
  function detectPP(filename) {
    const m = filename.match(/PP(\d+)/i);
    return m ? m[1] : null;
  }

  // ─── Normalize string for comparison ─────────────────────────────────────
  function norm(s) {
    if (!s) return '';
    return String(s).trim().toUpperCase()
      .replace(/\s+/g, ' ')
      .replace(/[·•]/g, '.')
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function numNorm(s) {
    return String(s || '').replace(/[\s ]/g, '').replace(',', '.');
  }

  // ─── Find row in Priority List by PP ─────────────────────────────────────
  function findRowPriority(wb, pp) {
    // Try all sheets
    for (const sheetName of wb.SheetNames) {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      // find header row
      let headerIdx = -1;
      let headers = [];
      for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const row = rows[i].map(c => norm(String(c)));
        if (row.some(c => c.includes('BOX NUMBER') || c.includes('PP'))) {
          headerIdx = i;
          headers = rows[i].map(c => String(c).trim());
          break;
        }
      }
      if (headerIdx === -1) continue;

      const col = (name) => headers.findIndex(h => norm(h).includes(norm(name)));
      const ppCol = headers.findIndex(h => norm(h).includes('BOX NUMBER') || (norm(h).includes('PP') && norm(h).length < 10));

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        const cellPP = String(row[ppCol] || '').replace(/\s/g,'');
        if (cellPP.toUpperCase().includes('PP' + pp) || cellPP === pp) {
          return { headers, row, col };
        }
      }
    }
    return null;
  }

  // ─── Find row in Briefing by PP ──────────────────────────────────────────
  function findRowBriefing(wb, pp) {
    for (const sheetName of wb.SheetNames) {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      // find header row — look for NPR/NPD column
      let headerIdx = -1;
      let headers = [];
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const row = rows[i].map(c => norm(String(c)));
        if (row.some(c => c.includes('NPR') || c.includes('NPD') || c.includes('365') || c.includes('ITEM NUMBER'))) {
          headerIdx = i;
          headers = rows[i].map(c => String(c).trim());
          break;
        }
      }
      if (headerIdx === -1) continue;

      // Find PP column — look for OBS/PP/DSA column (last column often has PP)
      const ppColIdx = headers.findIndex(h => {
        const n = norm(h);
        return n === 'DSA' || n === 'OBS' || n.includes('PP30') || n === 'PP';
      });

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        // Search PP in all cells of row
        for (let j = 0; j < row.length; j++) {
          const cell = String(row[j] || '').replace(/\s/g,'');
          if (cell.toUpperCase() === 'PP' + pp || cell === pp) {
            return { headers, row, col: (name) => headers.findIndex(h => norm(h).includes(norm(name))) };
          }
        }
        // Also check ppColIdx
        if (ppColIdx >= 0) {
          const cell = String(row[ppColIdx] || '').replace(/\s/g,'');
          if (cell.toUpperCase().includes('PP' + pp)) {
            return { headers, row, col: (name) => headers.findIndex(h => norm(h).includes(norm(name))) };
          }
        }
      }
    }
    return null;
  }

  // ─── Extract value from PDF ───────────────────────────────────────────────
  function pdfContains(text, value) {
    if (!value || value === '' || value === '0') return null; // skip empty
    const v = numNorm(String(value)).toUpperCase();
    const t = text.toUpperCase().replace(/[\s ]/g,'');
    return t.includes(v.replace(/\s/g,''));
  }

  function pdfContainsText(text, value) {
    if (!value) return false;
    return norm(text).includes(norm(String(value)));
  }

  // ─── Barcode match (strip spaces) ────────────────────────────────────────
  function barcodeMatch(text, code) {
    if (!code) return false;
    const stripped = String(code).replace(/\s/g,'');
    const textStripped = text.replace(/\s/g,'');
    return textStripped.includes(stripped);
  }

  // ─── Country detection ────────────────────────────────────────────────────
  function detectCountry(text) {
    const t = text.toUpperCase();
    if (t.includes('PRODUCED IN PORTUGAL') || t.includes('FABRIQUÉ AU PORTUGAL') || t.includes('FABRICADO EN/EM PORTUGAL')) return 'PT';
    if (t.includes('PRODUCED IN THE NETHERLANDS') || t.includes('FABRIQUÉ AUX PAYS-BAS') || t.includes('FABRICADO EN LOS PAÍSES BAJOS')) return 'NL';
    return null;
  }

  // ─── Build validation rows ────────────────────────────────────────────────
  function buildRows(pdfText, data, isBriefing) {
    const { headers, row, col } = data;
    const get = (name) => { const i = col(name); return i >= 0 ? row[i] : ''; };

    const rows = [];
    const check = (label, expected, found, matchFn) => {
      const exp = String(expected || '').trim();
      if (!exp || exp === '0' || exp === '#N/A') return; // skip empty/NA
      const ok = matchFn ? matchFn(pdfText, exp) : pdfContainsText(pdfText, exp);
      rows.push({ label, expected: exp, found: found || (ok ? '✓ Presente' : '✗ Ausente'), ok });
    };

    // Identifiers
    if (isBriefing) {
      check('Item Number (D365)', get('Item Number') || get('365   Item Number') || get('365  Item'), null, (t, v) => pdfContainsText(t, v));
      check('SKU', get('SKU NL') || get('ONIS SKU') || get('SKU'), null, (t, v) => pdfContainsText(t, v));
      const ean = get('EAN');
      check('EAN', ean, null, (t, v) => barcodeMatch(t, v));
      const scc = get('SCC');
      check('SCC', scc, null, (t, v) => barcodeMatch(t, v));
    } else {
      const itemNum = get('D365 Item') || get('Item Number') || get('NEW D365 ITEM');
      check('Item Number (D365)', itemNum, null, (t, v) => pdfContainsText(t, v));
      const sku = get('D365 SKU') || get('SKU') || get('NEW D365 SKU');
      check('SKU', sku, null, (t, v) => pdfContainsText(t, v));
      const ean = get('EAN') || get('EAN-Barcode') || get('EAN Barcode');
      check('EAN', ean, null, (t, v) => barcodeMatch(t, v));
      const scc = get('SCC') || get('SCC Barcode') || get('EAN / SCC');
      check('SCC', scc, null, (t, v) => barcodeMatch(t, v));
    }

    // Descriptions
    const descEN = get('English') || get('Glass description') || get('Item description');
    check('Designação EN', descEN, null);
    const descFR = get('French') || get('FR');
    check('Designação FR', descFR, null);
    const descES = get('Spanish') || get('ES');
    check('Designação ES', descES, null);
    const descPT = get('Portugese') || get('Portuguese') || get('PT');
    check('Designação PT', descPT, null);

    // Capacities
    const cl = get('CL') || get('cl');
    if (cl && String(cl) !== '0') {
      const clVal = String(cl).replace(',','.');
      const ok = pdfText.includes(clVal + 'cl') || pdfText.includes(clVal + 'CL') || pdfText.includes(clVal + ' cl');
      rows.push({ label: 'Capacidade (cl)', expected: clVal + 'cl', found: ok ? '✓ Presente' : '✗ Ausente', ok });
    }
    const ozUS = get('Oz US') || get('US oz') || get('OZ US');
    if (ozUS && String(ozUS) !== '0') {
      const v = String(ozUS).replace(',','.');
      const ok = pdfText.toLowerCase().includes(v + 'oz') || pdfText.toLowerCase().includes(v + ' oz') || pdfText.toLowerCase().includes(v + 'oz [us]');
      rows.push({ label: 'Capacidade US oz', expected: v + 'oz [us]', found: ok ? '✓ Presente' : '✗ Ausente', ok });
    }
    const ozUK = get('Oz UK') || get('UK oz') || get('OZ UK');
    if (ozUK && String(ozUK) !== '0') {
      const v = String(ozUK).replace(',','.');
      const ok = pdfText.toLowerCase().includes(v + 'oz') || pdfText.toLowerCase().includes(v + ' oz') || pdfText.toLowerCase().includes(v + 'oz [uk]');
      rows.push({ label: 'Capacidade UK oz', expected: v + 'oz [uk]', found: ok ? '✓ Presente' : '✗ Ausente', ok });
    }

    // Country
    const countryExpected = isBriefing
      ? (norm(get('Factory') || '') === 'PORTUGAL' ? 'PT' : 'NL')
      : (norm(get('Country') || get('Country of Origin') || '') === 'PORTUGAL' ? 'PT' : (norm(get('Country') || '') === 'THE NETHERLANDS' ? 'NL' : null));
    const countryFound = detectCountry(pdfText);
    if (countryExpected) {
      const countryLabel = countryExpected === 'PT' ? 'Portugal' : 'Holanda';
      rows.push({ label: 'País de produção', expected: countryLabel, found: countryFound === countryExpected ? '✓ ' + countryLabel : '✗ ' + (countryFound || 'Não encontrado'), ok: countryFound === countryExpected });
    }

    // Branding
    const brandChecks = [
      ['Logo ONIS', 'ONIS', (t) => t.toUpperCase().includes('ONIS')],
      ['Website', 'www.onis.eu', (t) => t.toLowerCase().includes('www.onis.eu')],
      ['Email', 'info@onis.eu', (t) => t.toLowerCase().includes('info@onis.eu')],
      ['FSC placeholder', 'FSC LOGO HERE', (t) => t.toUpperCase().includes('FSC')],
      ['Made in Europe', 'made in Europe', (t) => t.toLowerCase().includes('made in europe')],
      ['LEERDAM CRISAL GLASS', 'LEERDAM CRISAL GLASS', (t) => t.toUpperCase().includes('LEERDAM CRISAL GLASS')],
    ];
    for (const [label, expected, fn] of brandChecks) {
      const ok = fn(pdfText);
      rows.push({ label, expected, found: ok ? '✓ Presente' : '✗ Ausente', ok });
    }

    return rows;
  }

  // ─── Render results ───────────────────────────────────────────────────────
  function renderResults(pp, rows, errors) {
    const container = document.getElementById('results');
    const allOk = rows.every(r => r.ok) && errors.length === 0;

    let html = `
      <div class="result-header">
        <div class="result-pp">PP${pp} — Resultado da Validação</div>
        <div class="result-verdict ${allOk ? 'approved' : 'rejected'}">
          ${allOk ? '✅ Aprovada' : '❌ Não Aprovada'}
        </div>
      </div>`;

    if (errors.length) {
      html += `<div class="error-box">${errors.join('<br>')}</div>`;
    }

    html += `<table class="result-table">
      <thead>
        <tr>
          <th>Campo</th>
          <th>Esperado (Excel)</th>
          <th>PDF</th>
          <th style="text-align:center">Estado</th>
        </tr>
      </thead><tbody>`;

    for (const r of rows) {
      const failClass = r.ok ? '' : ' class="fail"';
      const foundClass = r.ok ? '' : ' class="fail-val"';
      html += `<tr>
        <td${failClass}>${r.label}</td>
        <td${failClass}>${r.expected}</td>
        <td${foundClass}>${r.found}</td>
        <td class="status">${r.ok ? '✅' : '❌'}</td>
      </tr>`;
    }

    html += `</tbody></table>
      <button class="btn-reset" onclick="resetForm()">← Nova Validação</button>`;

    container.innerHTML = html;
    container.style.display = 'block';
  }

  // ─── Main validation ──────────────────────────────────────────────────────
  async function runValidation() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('progress').style.display = 'block';
    document.getElementById('btn-validate').disabled = true;

    const errors = [];
    try {
      // 1. Extract PDF text
      const pdfText = await extractPdfText(pdfFile);

      // 2. Detect PP
      const pp = detectPP(pdfFile.name);
      if (!pp) errors.push('Não foi possível detetar o número PP no nome do ficheiro.');

      // 3. Parse Excel
      let wb;
      if (mode === 'briefing') {
        wb = await parseExcel(excelFile);
      } else {
        // Priority list mode — user must upload for now (no embedded file)
        // If no excel uploaded in priority mode, ask user
        if (!excelFile) {
          errors.push('No modo Priority List, carrega também o ficheiro Excel.');
          throw new Error('no excel');
        }
        wb = await parseExcel(excelFile);
      }

      // 4. Find row
      const isBriefing = mode === 'briefing';
      const data = isBriefing ? findRowBriefing(wb, pp) : findRowPriority(wb, pp);
      if (!data) {
        errors.push(`Não foi encontrada nenhuma linha com PP${pp} no Excel.`);
        throw new Error('no row');
      }

      // 5. Build validation rows
      const rows = buildRows(pdfText, data, isBriefing);

      // 6. Render
      renderResults(pp || '???', rows, errors);

    } catch(e) {
      if (errors.length === 0) errors.push('Erro inesperado: ' + e.message);
      renderResults('???', [], errors);
    }

    document.getElementById('progress').style.display = 'none';
    document.getElementById('btn-validate').disabled = false;
  }

  // ─── Reset ────────────────────────────────────────────────────────────────
  function resetForm() {
    pdfFile = null; excelFile = null;
    document.getElementById('input-pdf').value = '';
    document.getElementById('input-excel').value = '';
    document.getElementById('name-pdf').textContent = '';
    document.getElementById('name-excel').textContent = '';
    document.getElementById('card-pdf').classList.remove('has-file');
    document.getElementById('card-excel').classList.remove('has-file');
    document.getElementById('results').style.display = 'none';
    document.getElementById('btn-validate').disabled = true;
  }

  // ─── Drag & drop ──────────────────────────────────────────────────────────
  ['card-pdf','card-excel'].forEach(id => {
    const card = document.getElementById(id);
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('dragover'); });
    card.addEventListener('dragleave', () => card.classList.remove('dragover'));
    card.addEventListener('drop', e => {
      e.preventDefault(); card.classList.remove('dragover');
      const type = id === 'card-pdf' ? 'pdf' : 'excel';
      const input = document.getElementById('input-' + type);
      input.files = e.dataTransfer.files;
      onFileSelect(type, input);
    });
  });

  // Init
  setMode('priority');
</script>
</body>
</html>
